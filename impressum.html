  <script src="js/config.js"></script>
  <script>
    (function () {
      var d = document.documentElement;
      d.className += ' js';
      var t = (siteConfig.defaultTheme === 'light') ? 'light' : 'dark';
      try {
        var s = localStorage.getItem((siteConfig.storagePrefix || 'mucci') + '-theme');
        if (s === 'light' || s === 'dark') t = s;
      } catch (e) {}
      d.setAttribute('data-theme', t);
    })();
  </script>
