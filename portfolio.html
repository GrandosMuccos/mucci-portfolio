  <link rel="stylesheet" href="css/responsive.css">

  <script src="js/config.js"></script>
  <script>
    (function () {
      var d = document.documentElement;
      d.className += ' js';
      var t = (siteConfig.defaultTheme === 'light') ? 'light' : 'dark';
      try {
        var s = localStorage.getItem((siteConfig.storagePrefix || 'mucci') + '-theme');
        if (s === 'light' || s === 'dark') t = s;
      } catch (e) {}
      d.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body data-page="portfolio">

  <div id="site-header"></div>

  <main id="main" tabindex="-1">

    <section class="page-hero">
      <div class="container">
        <p class="eyebrow reveal" data-i18n="portfolioEyebrow"></p>
        <h1 class="page-title reveal" data-i18n="portfolioTitle"></h1>
        <p class="page-intro reveal" data-i18n="portfolioIntro"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <!-- Filter + Projekte werden aus content.js erzeugt (portfolioCategories, projects) -->
        <div id="filters" class="filters" role="group" data-i18n-aria="filterLabel"></div>
        <div id="project-grid" class="card-grid"></div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <noscript><p style="padding:1rem;text-align:center">Diese Website benötigt JavaScript. / This website requires JavaScript.</p></noscript>

  <script src="js/content.js"></script>
  <script src="js/media.js"></script>
  <script src="js/language.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
